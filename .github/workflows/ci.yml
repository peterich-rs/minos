name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.0"
  FLUTTER_VERSION: "3.44.0"
  FRB_CODEGEN_VERSION: "2.12.0"
  SQLX_CLI_VERSION: "0.8.6"
  # Dev-fallback silences build.rs warn-on-debug on CI debug builds.
  MINOS_BACKEND_URL: ws://127.0.0.1:8787/devices

jobs:
  # -------------------------------------------------------------------------
  # backend — Linux x64 SSOT for Rust backend + host crates.
  # Owns fmt/clippy/schema-parity/workspace tests (SQLite default).
  # -------------------------------------------------------------------------
  backend:
    name: backend (linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain (linux-only override)
        # rust-toolchain.toml lists Apple targets that waste time on Ubuntu.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Install sqlx-cli
        # Offline-metadata freshness check. Sqlite+postgres features match the
        # backend adapter set. rust-cache keeps ~/.cargo/bin across runs.
        run: cargo install sqlx-cli --version ${{ env.SQLX_CLI_VERSION }} --no-default-features --features sqlite,postgres --locked

      - name: Verify sqlx offline metadata
        # Catches stale `.sqlx/` before opaque test failures inside check-rust.
        # `-- -p minos-backend --all-targets` is required because the workspace
        # sets `default-members = []`.
        run: |
          mkdir -p target
          DATABASE_URL=sqlite://target/sqlx-prepare.sqlite?mode=rwc cargo sqlx prepare --check --workspace -- -p minos-backend --all-targets

      - name: cargo xtask check-rust
        # Linux SSOT: fmt, clippy, real lints, schema-parity, workspace tests,
        # daemon --features test-support, backend platform schema drift.
        run: cargo xtask check-rust

  # -------------------------------------------------------------------------
  # backend-pg — Postgres storage-parity contract smoke (MINOS_PG_TESTS=1).
  # Production dialect authority; runs only when backend SQLite gate is green.
  # -------------------------------------------------------------------------
  backend-pg:
    name: backend postgres smoke
    needs: [backend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minos
          POSTGRES_PASSWORD: minos
          POSTGRES_DB: minos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MINOS_PG_TESTS: "1"
      MINOS_DATABASE_URL: postgres://minos:minos@localhost:5432/minos
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: cargo xtask lint-schema-parity
        run: cargo xtask lint-schema-parity

      - name: Postgres migration + contract smoke
        run: cargo test -p minos-backend --test pg_migration --test pg_contract_smoke -- --nocapture

  # -------------------------------------------------------------------------
  # mobile — Flutter/Dart fmt + analyze + non-ffi tests + FRB drift.
  # iOS/Android native builds stay on local/release jobs; this owns static gates.
  # -------------------------------------------------------------------------
  mobile:
    name: mobile (fmt/analyze/test/frb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (for frb-drift regeneration)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        # Plain `flutter` (not fvm) on CI. Version must match apps/mobile/.fvmrc.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install flutter_rust_bridge_codegen
        # Pin matches `cargo xtask bootstrap` / workspace flutter_rust_bridge.
        run: cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_CODEGEN_VERSION }} --locked

      - name: flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: dart format --set-exit-if-changed lib test
        # Scope to project sources (not rust_builder/cargokit or build/).
        working-directory: apps/mobile
        run: |
          if [ -d test ]; then
            dart format --set-exit-if-changed lib test
          else
            dart format --set-exit-if-changed lib
          fi

      - name: dart analyze
        working-directory: apps/mobile
        # Hard cap: native analysis_server plugins (riverpod_lint) have hung
        # `dart analyze` indefinitely on ubuntu-latest with no output (30m+).
        # Fail cheaply rather than burn the runner quota.
        timeout-minutes: 5
        # Warnings/errors fatal; info-level lints stay advisory.
        # Disable analysis_server plugins for this step only — core analyzer +
        # flutter_lints still run; riverpod_lint remains for local IDE.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("analysis_options.yaml")
          lines = path.read_text().splitlines(keepends=True)
          out = []
          skipping = False
          for line in lines:
              if not skipping and line.startswith("plugins:"):
                  skipping = True
                  out.append(
                      "# [ci] analysis_server plugins disabled for hang safety "
                      "(see .github/workflows/ci.yml mobile analyze)\n"
                  )
                  continue
              if skipping:
                  stripped = line.lstrip()
                  if stripped and not stripped.startswith("#") and line[:1] not in (" ", "\t"):
                      skipping = False
                      out.append(line)
                  continue
              out.append(line)
          path.write_text("".join(out))
          PY
          dart analyze --fatal-warnings

      - name: flutter test (exclude ffi-coupled tests)
        working-directory: apps/mobile
        run: |
          if [ -d test ]; then
            flutter test --exclude-tags ffi
          else
            echo "No apps/mobile/test directory; skipping Flutter tests."
          fi

      - name: frb codegen drift
        # Sole CI owner of FRB drift. Run from apps/mobile so frb's internal
        # `fvm flutter --version` resolves via .fvmrc when fvm is present;
        # plain flutter-action still regenerates from the root config file.
        working-directory: apps/mobile
        run: |
          flutter_rust_bridge_codegen generate --config-file "$GITHUB_WORKSPACE/flutter_rust_bridge.yaml"
          git diff --exit-code -- \
            "$GITHUB_WORKSPACE/apps/mobile/lib/src/rust" \
            "$GITHUB_WORKSPACE/crates/minos-ffi-frb/src/frb_generated.rs"

  # -------------------------------------------------------------------------
  # web — web admin JS/TS gate (independent of desktop native).
  # -------------------------------------------------------------------------
  web:
    name: web (pnpm check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: apps/web pnpm check
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  # -------------------------------------------------------------------------
  # desktop — macOS shell: TS/biome gates + Tauri/Rust desktop check.
  # Frontend static checks + cargo check -p minos-desktop on Apple host.
  # Full signed release remains desktop-release.yml.
  # -------------------------------------------------------------------------
  desktop:
    name: desktop (macos)
    needs: [backend]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: apps/desktop pnpm check:all
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm check:all

      - name: cargo check -p minos-desktop
        # Compile-check the Tauri host on macOS without full packaging/signing.
        run: cargo check -p minos-desktop
