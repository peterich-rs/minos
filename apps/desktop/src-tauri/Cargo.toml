[package]
name = "minos-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Minos host desktop shell (Tauri)"
# Required by `tauri build` when this crate has multiple [[bin]] targets
# (app entry + verify-updater-sig helper).
default-run = "minos-desktop"

[lib]
name = "minos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
jsonrpsee = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
minos-protocol = { path = "../../../crates/minos-protocol" }
minos-domain = { path = "../../../crates/minos-domain" }
minos-daemon = { path = "../../../crates/minos-daemon" }
minos-chat-store = { path = "../../../crates/minos-chat-store" }
minos-ui-protocol = { path = "../../../crates/minos-ui-protocol" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
http = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
ctrlc = "3"
minisign-verify = "0.2"
base64 = "0.22"
# Durable Desktop IM outbox (replaces localStorage for cloud intent).
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[[bin]]
name = "verify-updater-sig"
path = "src/bin/verify_updater_sig.rs"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
